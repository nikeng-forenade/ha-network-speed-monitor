name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Type check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Ensure build output is committed
        run: |
          git diff --exit-code -- dist custom_components
          python -c "import json,pathlib;p=json.loads(pathlib.Path('custom_components/network_speed_monitor/manifest.json').read_text());v=json.loads(pathlib.Path('package.json').read_text())['version'];assert p['version']==v,(p['version'],v)"
